resources:
  jobs:
    etl_fraud_pipeline:
      name: "[${bundle.target}] Fraud Detection - ETL Workflow"
      
      job_clusters:
        - job_cluster_key: etl_compute
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1

      tasks:
        - task_key: bronze_to_silver
          job_cluster_key: etl_compute
          libraries:
            - whl: ../dist/*.whl
          notebook_task:
            notebook_path: ../src/notebooks/01_etl_bronze_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          job_cluster_key: etl_compute
          libraries:
            - whl: ../dist/*.whl
          notebook_task:
            notebook_path: ../src/notebooks/02_etl_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}